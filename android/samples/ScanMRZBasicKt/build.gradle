import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appVersionName = "1.0.0"

base {
    archivesName = "MRZScannerBasicKt-$appVersionName"
}

android {
    namespace = 'com.dynamsoft.scanmrzbasickt'
    compileSdk 36

    defaultConfig {
        applicationId "com.dynamsoft.scanmrzbasickt"
        minSdk 21
        targetSdk 36

        versionCode 1
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {
    implementation 'com.dynamsoft:mrzscannerbundle:3.6.2000'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
